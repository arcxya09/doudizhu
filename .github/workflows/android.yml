name: Native Kotlin Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-build-and-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native app, test Kotlin engine and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apk-and-device-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
            device-results/
      - name: Publish native v3.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v3.0.1 >/dev/null 2>&1; then
            cp app/build/outputs/apk/debug/app-debug.apk doudizhu-3.0.1-native.apk
            gh release create v3.0.1 doudizhu-3.0.1-native.apk device-results/*.png --target "$GITHUB_SHA" --title "闲来斗地主 v3.0.1 · 经典布局版" --notes-file docs/release-v3.0.1.md --prerelease
          else
            gh release upload v3.0.1 device-results/*.png --clobber
          fi
