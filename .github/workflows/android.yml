name: Native Kotlin Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build-and-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native app, test Kotlin engine and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Reject unsigned Release and aggregate builds
        run: |
          for task in :app:assembleRelease :app:assemble; do
            if gradle --no-daemon "$task" --dry-run > release-signing-guard.txt 2>&1; then
              cat release-signing-guard.txt
              echo "Unsigned Release task unexpectedly succeeded"
              exit 1
            fi
            if ! grep -q 'Release requires permanent signing credentials' release-signing-guard.txt; then
              cat release-signing-guard.txt
              exit 1
            fi
          done
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apk-and-device-results
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
            device-results/

  official-release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: native-build-and-device-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find previous permanent official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find-previous-official.py
      - name: Restore and verify permanent signing identity
        env:
          DDZ_KEYSTORE_BASE64: ${{ secrets.DDZ_KEYSTORE_BASE64 }}
          DDZ_STORE_PASSWORD: ${{ secrets.DDZ_STORE_PASSWORD }}
          DDZ_KEY_ALIAS: ${{ secrets.DDZ_KEY_ALIAS }}
          DDZ_KEY_PASSWORD: ${{ secrets.DDZ_KEY_PASSWORD }}
        run: python3 scripts/prepare-release-signing.py
      - name: Build and inspect signed non-debuggable Release APK
        env:
          DDZ_STORE_PASSWORD: ${{ secrets.DDZ_STORE_PASSWORD }}
          DDZ_KEY_ALIAS: ${{ secrets.DDZ_KEY_ALIAS }}
          DDZ_KEY_PASSWORD: ${{ secrets.DDZ_KEY_PASSWORD }}
        run: python3 scripts/build-official-release.py
      - name: Remove private key immediately after signing
        if: always()
        run: rm -rf "$RUNNER_TEMP/ddz-release-signing"
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real Release upgrade preserves local data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check-release-upgrade.sh "$(cat release-upgrade-baseline.txt)" app/build/outputs/apk/release/app-release.apk
      - name: Publish verified stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-official-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-apk-and-upgrade-results
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/reports/lint-results-release.*
            release-results/
      - name: Final private key cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/ddz-release-signing"
