name: Build offline Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test rules and AI
        run: node --test tests/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doudizhu-1.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Publish installable test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.1.0 >/dev/null 2>&1; then
            cp app/build/outputs/apk/debug/app-debug.apk doudizhu-1.1.0.apk
            gh release create v1.1.0 doudizhu-1.1.0.apk --target "$GITHUB_SHA" --title "闲来斗地主 v1.1.0 · 离线测试版" --notes-file docs/release-v1.1.0.md --prerelease
          fi
