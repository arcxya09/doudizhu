name: Verify and publish locally signed official APK
on:
  push:
    branches: ['release-artifacts/**']
permissions:
  contents: write
  actions: read
jobs:
  verify-upgrade-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Check signed APK provenance, fixed signer and native QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/load-offline-release.py
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual signed upgrade preserves data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check-release-upgrade.sh release-baseline.apk app/build/outputs/apk/release/app-release.apk
      - name: Publish permanent stable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-official-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-apk-and-upgrade-results
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-results/
