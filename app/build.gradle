plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def applicationVersionCode = 24
def resolvedVersionCode = (project.findProperty('ddzVersionCode') ?: applicationVersionCode).toString().toInteger()
def releaseSecretNames = ['DDZ_KEYSTORE_PATH', 'DDZ_STORE_PASSWORD', 'DDZ_KEY_ALIAS', 'DDZ_KEY_PASSWORD']
def hasReleaseSigning = releaseSecretNames.every { System.getenv(it)?.trim() }
// Explicit preparation mode produces an unsigned transport artifact only.
// Publishing still requires the pinned permanent certificate and a real upgrade test.
def prepareUnsignedRelease = project.findProperty('ddzPrepareUnsignedRelease') == 'true'
def requireReleaseSigning = {
    if (!hasReleaseSigning && !prepareUnsignedRelease) throw new GradleException('Release requires permanent signing credentials. Use explicit unsigned preparation only for offline signing; unsigned APKs cannot be published.')
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) requireReleaseSigning()
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) requireReleaseSigning()
}
android {
    namespace 'com.arcxya.doudizhu'
    compileSdk 35
    defaultConfig {
        applicationId 'com.arcxya.doudizhu'
        minSdk 26
        targetSdk 35
        versionCode resolvedVersionCode
        versionName '3.6.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            permanentRelease {
                storeFile file(System.getenv('DDZ_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('DDZ_STORE_PASSWORD')
                keyAlias System.getenv('DDZ_KEY_ALIAS')
                keyPassword System.getenv('DDZ_KEY_PASSWORD')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (hasReleaseSigning && !prepareUnsignedRelease) signingConfig signingConfigs.permanentRelease
        }
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
// ReleaseProcessTest reads the upgrade check by path, so editing that script has to re-run the tests;
// without this a rename slips through locally and only fails much later in the signed release job.
tasks.withType(Test).configureEach {
    inputs.file(rootProject.file('scripts/check-release-upgrade.sh')).withPathSensitivity(PathSensitivity.RELATIVE).optional()
}
